apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "core-payment-solution.fullname" . }}-config
  labels:
    {{- include "core-payment-solution.labels" . | nindent 4 }}
data:
  honeypot.yaml: |
    collector:
      ingest_address: ":{{ .Values.collector.service.ingestPort }}"
      dashboard_address: ":{{ .Values.collector.service.dashboardPort }}"
      data_directory: "/var/lib/honeypot"
    detection:
      port_scan_window: {{ .Values.config.detection.portScanWindow | quote }}
      port_scan_distinct_ports: {{ .Values.config.detection.portScanDistinctPorts }}
      brute_force_window: {{ .Values.config.detection.bruteForceWindow | quote }}
      brute_force_attempts: {{ .Values.config.detection.bruteForceAttempts }}
      lateral_movement_distinct_machines: {{ .Values.config.detection.lateralMovementMinimum }}
      session_idle_timeout: {{ .Values.config.detection.sessionIdleTimeout | quote }}
    alarm:
      minimum_severity: {{ .Values.config.alarm.minimumSeverity | quote }}
      debounce_interval: {{ .Values.config.alarm.debounceInterval | quote }}
      report_after_idle: {{ .Values.config.alarm.reportAfterIdle | quote }}
    slack:
      enabled: {{ .Values.notifications.slack.enabled }}
      webhook_env: "SLACK_WEBHOOK_URL"
      channel: {{ .Values.notifications.slack.channel | quote }}
      username: {{ .Values.notifications.slack.username | quote }}
    deception:
      organization_name: "Core Payment Solution"
      fake_card_count: 250
      fake_account_count: 80
